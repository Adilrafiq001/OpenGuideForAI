<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="Zero-cost, browser-native AI engineering curriculum with client-side Python Pyodide execution." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>OpenGuide — AI Engineering Studio</title>
    <script>
      (function() {
        try {
          var theme = 'obsidian';
          var raw = localStorage.getItem('openguide-settings');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme) {
              theme = parsed.state.theme;
            }
          } else {
            var legacy = localStorage.getItem('openguide_theme');
            if (legacy) theme = legacy;
          }
          var lightThemes = ['pure-paper', 'e-ink-papyrus', 'claude-light', 'linear-light', 'notion-cream', 'github-light', 'swiss-modernist', 'solarized-light', 'nordic-fjord', 'matcha-ceremonial'];
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-mode', lightThemes.indexOf(theme) !== -1 ? 'light' : 'dark');

          var themeBgs = {
            'pure-paper': '#ffffff',
            'e-ink-papyrus': '#fbf8f2',
            'claude-light': '#faf6f0',
            'linear-light': '#f8f9fa',
            'notion-cream': '#faf8f5',
            'github-light': '#ffffff',
            'swiss-modernist': '#fcfcfc',
            'solarized-light': '#fdf6e3',
            'nordic-fjord': '#f1f5f9',
            'matcha-ceremonial': '#f3f6f1',
            'obsidian': '#050505',
            'claude-dark': '#141210',
            'linear-dark': '#0d0e15',
            'cursor-dark': '#080c14',
            'cyberpunk-neon': '#0b0714',
            'github-dark': '#161b22',
            'monokai-pro': '#1a191e',
            'nord-dark': '#1e222a',
            'dracula': '#191a21',
            'circadian-amber': '#0a0908'
          };
          var bg = themeBgs[theme] || '#050505';

          var themeTextColors = {
            'pure-paper': '#111111',
            'e-ink-papyrus': '#1c1815',
            'claude-light': '#1e140d',
            'linear-light': '#1a1d20',
            'notion-cream': '#1c1917',
            'github-light': '#1f2328',
            'swiss-modernist': '#09090b',
            'solarized-light': '#073642',
            'nordic-fjord': '#0f172a',
            'matcha-ceremonial': '#142918',
            'obsidian': '#ffffff',
            'claude-dark': '#f5f0ea',
            'linear-dark': '#f1f2f6',
            'cursor-dark': '#f8fafc',
            'cyberpunk-neon': '#fdf2f8',
            'github-dark': '#f0f6fc',
            'monokai-pro': '#fcfcfa',
            'nord-dark': '#eceff4',
            'dracula': '#f8f8f2',
            'circadian-amber': '#fef3c7'
          };
          var textColor = themeTextColors[theme] || '#f8fafc';

          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = textColor;

          var styleEl = document.createElement('style');
          styleEl.id = 'theme-pre-bootstrap';
          styleEl.innerHTML = 'html, body, #root { background-color: ' + bg + '; color: ' + textColor + '; min-height: 100vh; } @keyframes ogPulse { 0%, 100% { opacity: 0.2; transform: scale(0.98); } 50% { opacity: 0.45; transform: scale(1.02); } }';
          document.head.appendChild(styleEl);

          var savedLang = localStorage.getItem('openguide_lang') || 'en';
          document.documentElement.setAttribute('lang', savedLang);
          if (savedLang === 'ur' || savedLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.classList.add('rtl-active');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body class="overflow-x-hidden antialiased">
    <div id="root">
      <div id="og-pre-loader" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 48px; height: 48px; border-radius: 14px; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; font-family: monospace; animation: ogPulse 1.4s ease-in-out infinite;">OG</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
