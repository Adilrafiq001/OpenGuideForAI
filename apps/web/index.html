    <script>
      (function() {
        try {
          // App must always open in Claude Warm Ivory (light theme) and English
          var theme = 'claude-light';
          var sessionTheme = sessionStorage.getItem('openguide_session_theme');
          if (sessionTheme) {
            theme = sessionTheme;
          }

          var lightThemes = ['pure-paper', 'e-ink-papyrus', 'claude-light', 'linear-light', 'notion-cream', 'github-light', 'swiss-modernist', 'solarized-light', 'nordic-fjord', 'matcha-ceremonial'];
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-mode', lightThemes.indexOf(theme) !== -1 ? 'light' : 'dark');

          var themeBgs = {
            'pure-paper': '#ffffff',
            'e-ink-papyrus': '#fbf8f2',
            'claude-light': '#faf6f0',
            'linear-light': '#f8f9fa',
            'notion-cream': '#faf8f5',
            'github-light': '#ffffff',
            'swiss-modernist': '#fcfcfc',
            'solarized-light': '#fdf6e3',
            'nordic-fjord': '#f1f5f9',
            'matcha-ceremonial': '#f3f6f1',
            'obsidian': '#050505',
            'claude-dark': '#141210',
            'linear-dark': '#0d0e15',
            'cursor-dark': '#080c14',
            'cyberpunk-neon': '#0b0714',
            'github-dark': '#161b22',
            'monokai-pro': '#1a191e',
            'nord-dark': '#1e222a',
            'dracula': '#191a21',
            'circadian-amber': '#0a0908'
          };
          var bg = themeBgs[theme] || '#faf6f0';

          var themeTextColors = {
            'pure-paper': '#111111',
            'e-ink-papyrus': '#1c1815',
            'claude-light': '#1e140d',
            'linear-light': '#1a1d20',
            'notion-cream': '#1c1917',
            'github-light': '#1f2328',
            'swiss-modernist': '#09090b',
            'solarized-light': '#073642',
            'nordic-fjord': '#0f172a',
            'matcha-ceremonial': '#142918',
            'obsidian': '#ffffff',
            'claude-dark': '#f5f0ea',
            'linear-dark': '#f1f2f6',
            'cursor-dark': '#f8fafc',
            'cyberpunk-neon': '#fdf2f8',
            'github-dark': '#f0f6fc',
            'monokai-pro': '#fcfcfa',
            'nord-dark': '#eceff4',
            'dracula': '#f8f8f2',
            'circadian-amber': '#fef3c7'
          };
          var textColor = themeTextColors[theme] || '#1e140d';

          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = textColor;

          var styleEl = document.createElement('style');
          styleEl.id = 'theme-pre-bootstrap';
          styleEl.innerHTML = 'html, body, #root { background-color: ' + bg + '; color: ' + textColor + '; min-height: 100vh; }';
          document.head.appendChild(styleEl);

          // Always open in English on fresh visit / startup
          var savedLang = sessionStorage.getItem('openguide_session_lang') || localStorage.getItem('openguide_lang') || 'en';
          document.documentElement.setAttribute('lang', savedLang);
          if (savedLang === 'ur' || savedLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.classList.add('rtl-active');
          } else {
            document.documentElement.setAttribute('dir', 'ltr');
            document.documentElement.classList.remove('rtl-active');
          }
        } catch (e) {}
      })();
    </script>
