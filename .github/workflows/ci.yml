name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      working-directory: ./apps/web

    - name: Run Playwright tests
      run: npx playwright test
      working-directory: ./apps/web

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build web
      run: npm run build --workspace=apps/web
    # Deployment to Cloudflare Pages relies on Cloudflare's direct GitHub integration
    # for zero-cost seamless setup, as per architecture. No action needed here beyond building to verify.
